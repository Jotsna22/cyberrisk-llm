[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberrisk-llm"
version = "0.1.0"
description = "LLM-assisted attack path risk assessment and adaptive defense"
requires-python = ">=3.10"
dependencies = ["networkx>=3.0"]

[project.scripts]
cyberrisk = "cyberrisk.cli:main"

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
